<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Carpetas que nunca deben servirse por HTTP
    <DirectoryMatch "^/var/www/html/(includes|config|db|docker|docs)">
        Require all denied
    </DirectoryMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    # Se dejan los logs por omision del contenedor (van a stdout/stderr y
    # se leen con `docker compose logs app`). Apuntarlos a un volumen
    # montado desde el host impide que Apache arranque si el permiso falla.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
