date.timezone = America/Mazatlan
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
; Si la carpeta no es escribible, PHP cae a stderr (visible con docker compose logs)
error_log = /var/www/storage/logs/php-error.log
; El album sube hasta 20 archivos de golpe. Con post_max_size en 24M,
; ocho radiografias se pasaban del limite y PHP descartaba el envio
; ENTERO sin avisar: $_POST y $_FILES llegaban vacios y el sistema
; respondia "selecciona al menos un archivo". Parecia que el sistema no
; guardaba radiografias; en realidad nunca le llegaban.
;
; upload_max_filesize es por archivo; post_max_size es por envio y
; tiene que ser bastante mayor, porque ahi caben todos juntos.
upload_max_filesize = 40M
post_max_size = 400M
max_file_uploads = 25

; Redimensionar veinte imagenes grandes con GD toma tiempo y memoria.
; Una panoramica de 4000x3000 ocupa unos 48 MB descomprimida en memoria
; mientras se procesa, aunque el archivo pese 5.
max_execution_time = 180
memory_limit = 512M

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
; Cuatro horas, para que cuadre con MINUTOS_SESION de config.php.
;
; Las dos tienen que moverse juntas y es facil olvidarlo: PHP borra los
; datos de la sesion pasado gc_maxlifetime, sin importar lo que diga la
; aplicacion. Dejando esto en una hora, subir MINUTOS_SESION a cuatro no
; habria servido de nada —la sesion seguiria cayendose a la hora— y el
; sintoma seria "el cambio no funciono", sin pista de por que.
;
; Un poco por encima de las cuatro horas: el recolector corre cuando le
; toca, no al segundo, y no conviene que la sesion muera justo en el
; limite que la aplicacion considera valido.
session.gc_maxlifetime = 15000
