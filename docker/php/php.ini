date.timezone = America/Mazatlan
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
; Si la carpeta no es escribible, PHP cae a stderr (visible con docker compose logs)
error_log = /var/www/storage/logs/php-error.log
; El album sube hasta 20 archivos de golpe. Con post_max_size en 24M,
; ocho radiografias se pasaban del limite y PHP descartaba el envio
; ENTERO sin avisar: $_POST y $_FILES llegaban vacios y el sistema
; respondia "selecciona al menos un archivo". Parecia que el sistema no
; guardaba radiografias; en realidad nunca le llegaban.
;
; upload_max_filesize es por archivo; post_max_size es por envio y
; tiene que ser bastante mayor, porque ahi caben todos juntos.
upload_max_filesize = 40M
post_max_size = 400M
max_file_uploads = 25

; Redimensionar veinte imagenes grandes con GD toma tiempo y memoria.
; Una panoramica de 4000x3000 ocupa unos 48 MB descomprimida en memoria
; mientras se procesa, aunque el archivo pese 5.
max_execution_time = 180
memory_limit = 512M

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
; La sesion no caduca: un anio, para que cuadre con MINUTOS_SESION.
;
; El recolector de sesiones de PHP manda sobre la aplicacion: borra los
; datos de la sesion pasado gc_maxlifetime, sin importar lo que diga el
; codigo. Los dos numeros tienen que moverse JUNTOS, y ya paso una vez:
; subir MINUTOS_SESION a cuatro horas no sirvio de nada porque esto
; seguia en una hora, y el sintoma fue "el cambio no funciono" sin
; ninguna pista de por que.
;
; Desde el 17 de octubre de 2026 la sesion no caduca (MINUTOS_SESION = 0
; en config.php), asi que aqui va un anio. No es "infinito" —PHP no
; tiene esa opcion— sino mas de lo que vive una instalacion sin que
; alguien cambie su contrasenia.
;
; Lo que esto cuesta esta explicado donde se decide, en config.php:
; MINUTOS_SESION. Si algun dia hay que volver a una caducidad corta, se
; cambian LOS DOS.
session.gc_maxlifetime = 31536000
