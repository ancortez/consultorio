services:
  app:
    build:
      context: ./docker/php
    container_name: consultorio_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/storage
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-consultorio_dental}
      DB_USER: ${DB_USER:-consultorio}
      DB_PASS: ${DB_PASS:-consultorio}
      APP_ENV: ${APP_ENV:-desarrollo}
      APP_TZ: ${APP_TZ:-America/Mazatlan}
      # MinIO vive en su propio proyecto (infra/minio). Se le habla por
      # nombre a traves de la red compartida, sin exponer puertos.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET:   ${MINIO_BUCKET:-consultorio-dental}
      MINIO_LLAVE:    ${MINIO_LLAVE:-minioadmin}
      MINIO_SECRETO:  ${MINIO_SECRETO:-minioadmin123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna
      - sistemas

  db:
    image: mysql:8.0
    container_name: consultorio_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-consultorio_dental}
      MYSQL_USER: ${DB_USER:-consultorio}
      MYSQL_PASSWORD: ${DB_PASS:-consultorio}
      TZ: ${APP_TZ:-America/Mazatlan}
    networks:
      - interna
    volumes:
      - db_data:/var/lib/mysql
      # Los .sql se ejecutan en orden alfabetico la primera vez que
      # se crea el volumen. Para recargar: docker compose down -v
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: consultorio_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M
    networks:
      - interna
    depends_on:
      - db

volumes:
  db_data:

networks:
  # Red propia del consultorio: aqui viven la app, MySQL y phpMyAdmin.
  interna:

  # Red compartida entre sistemas, solo para alcanzar MinIO.
  # Se crea una vez con:  docker network create sistemas
  # Si no existe, el sistema levanta igual pero no podra guardar archivos.
  sistemas:
    external: true
    name: sistemas
