# =====================================================================
#  MinIO - almacenamiento de archivos compartido entre sistemas
#
#  Esta carpeta es independiente del consultorio: puedes moverla a
#  ~/Proyectos/minio y seguira funcionando igual. La idea es levantar
#  UN solo MinIO y que todos tus sistemas guarden ahi, cada uno en su
#  propio bucket.
#
#  Antes de la primera vez:
#     docker network create sistemas
#
#  Levantar:   docker compose up -d
#  Consola:    http://localhost:9101
# =====================================================================

# =====================================================================
#  ¿Por que quay.io y no Docker Hub?
#
#  El 11 de septiembre de 2026 MinIO borro las imagenes minio/minio y
#  minio/mc de Docker Hub. Una instalacion que ya las tenia bajadas
#  sigue funcionando; un servidor nuevo falla con
#  "pull access denied ... repository does not exist".
#
#  quay.io es el registro que MinIO sigue publicando.
#
#  Y hay algo de fondo que conviene saber: MinIO archivo la edicion
#  comunitaria. El repositorio quedo en solo lectura y no habra mas
#  parches, incluidos los de seguridad. Lo que corre aqui funciona,
#  pero no va a recibir arreglos.
#
#  Para un sistema que va a guardar expedientes clinicos durante anios,
#  eso es una deuda con fecha. En docs/almacenamiento-de-archivos.md
#  esta el plan para cambiarlo por Garage, que es mas chico, sigue vivo
#  y habla el mismo protocolo S3.
# =====================================================================

services:
  minio:
    # La version se fija en el .env. Con ":latest" un reinicio
    # cualquiera puede traer una version distinta a la probada.
    image: ${MINIO_IMAGEN:-quay.io/minio/minio:latest}
    container_name: minio_compartido
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # 9000 es el puerto de la API (el que usan los sistemas)
      - "${MINIO_PORT_API:-9100}:9000"
      # 9001 es la consola web para revisar archivos a mano
      - "${MINIO_PORT_CONSOLA:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USUARIO:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_PORT_CONSOLA:-9101}
    volumes:
      - minio_data:/data
    networks:
      - sistemas
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crea los buckets al arrancar. Es un contenedor de un solo uso:
  # hace su trabajo y se apaga.
  crear_buckets:
    image: ${MINIO_IMAGEN_MC:-quay.io/minio/mc:latest}
    container_name: minio_buckets
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sistemas
    environment:
      MINIO_USUARIO: ${MINIO_USUARIO:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      # Un bucket por sistema, separados por comas.
      BUCKETS: ${MINIO_BUCKETS:-consultorio-dental}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USUARIO $$MINIO_PASSWORD;
      for b in $$(echo $$BUCKETS | tr ',' ' '); do
        mc mb --ignore-existing local/$$b;
        mc version enable local/$$b;
        echo \"bucket listo: $$b\";
      done;
      echo 'Buckets configurados.';
      "

volumes:
  minio_data:
    name: minio_data_compartido

networks:
  # Red externa: la crean una vez con 'docker network create sistemas'
  # y todos los sistemas se cuelgan de ella. Asi el consultorio puede
  # hablarle a MinIO por su nombre (http://minio:9000) sin exponer
  # nada fuera de Docker.
  sistemas:
    external: true
    name: sistemas
