# =====================================================================
#  MinIO - produccion
#
#  Tres diferencias contra el compose de local:
#
#  1. No hay credenciales de fabrica. Si el .env no trae usuario y
#     contrasenia, esto NO arranca. En local 'minioadmin/minioadmin123'
#     es comodo; en internet es equivalente a dejar la puerta abierta.
#
#  2. El puerto de la API (9000) no sale del servidor. Solo el sistema
#     le habla, por la red compartida. Publicarlo no aportaria nada y
#     abriria una puerta mas.
#
#  3. La consola (9001) tampoco sale sola: o se llega por tunel SSH, o
#     se publica con HTTPS a traves de Caddy poniendo DOMINIO_MINIO.
#     Nunca en HTTP pelado: en la consola se ven y se descargan TODOS
#     los documentos del expediente.
#
#  Uso:
#     docker compose -f docker-compose.produccion.yml up -d
# =====================================================================

# =====================================================================
#  ¿Por que quay.io y no Docker Hub?
#
#  El 11 de septiembre de 2026 MinIO borro las imagenes minio/minio y
#  minio/mc de Docker Hub. Una instalacion que ya las tenia bajadas
#  sigue funcionando; un servidor nuevo falla con
#  "pull access denied ... repository does not exist".
#
#  quay.io es el registro que MinIO sigue publicando.
#
#  Y hay algo de fondo que conviene saber: MinIO archivo la edicion
#  comunitaria. El repositorio quedo en solo lectura y no habra mas
#  parches, incluidos los de seguridad. Lo que corre aqui funciona,
#  pero no va a recibir arreglos.
#
#  Para un sistema que va a guardar expedientes clinicos durante anios,
#  eso es una deuda con fecha. En docs/almacenamiento-de-archivos.md
#  esta el plan para cambiarlo por Garage, que es mas chico, sigue vivo
#  y habla el mismo protocolo S3.
# =====================================================================

services:
  minio:
    # La version se fija en el .env. Con ":latest" un reinicio
    # cualquiera puede traer una version distinta a la probada.
    image: ${MINIO_IMAGEN:-quay.io/minio/minio:latest}
    container_name: minio_compartido
    restart: unless-stopped
    command: server /data --console-address ":9001"

    # El puerto de la consola se ata a 127.0.0.1: existe dentro del
    # servidor pero no se ve desde internet. Para entrar:
    #    ssh -L 9101:localhost:9101 consultorio@TU_IP
    #    y luego http://localhost:9101 en tu navegador
    ports:
      - "127.0.0.1:${MINIO_PORT_CONSOLA:-9101}:9001"

    environment:
      # Los dos signos de interrogacion obligan a que existan: si
      # faltan, Docker se niega a levantar en lugar de arrancar con las
      # credenciales de fabrica.
      MINIO_ROOT_USER:     ${MINIO_USUARIO:?Falta MINIO_USUARIO en el .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Falta MINIO_PASSWORD en el .env}

      # Si se publica con dominio, la consola necesita saber su
      # direccion publica para armar bien los enlaces de sesion.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_URL_CONSOLA:-http://localhost:9101}

    volumes:
      - minio_data:/data
    networks:
      - sistemas
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Crea los buckets al arrancar y los deja privados. Es un contenedor
  # de un solo uso: hace su trabajo y se apaga.
  crear_buckets:
    image: ${MINIO_IMAGEN_MC:-quay.io/minio/mc:latest}
    container_name: minio_buckets
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - sistemas
    environment:
      MINIO_USUARIO: ${MINIO_USUARIO}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      BUCKETS: ${MINIO_BUCKETS:-consultorio-dental}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USUARIO $$MINIO_PASSWORD;
      for b in $$(echo $$BUCKETS | tr ',' ' '); do
        mc mb --ignore-existing local/$$b;
        mc version enable local/$$b;
        mc anonymous set none local/$$b;
        echo \"bucket listo y privado: $$b\";
      done;
      echo 'Buckets configurados.';
      "

volumes:
  minio_data:
    name: minio_data_compartido

networks:
  sistemas:
    external: true
    name: sistemas
